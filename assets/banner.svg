<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" style="background: #0f172a; border-radius: 12px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="firewall-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="260" fill="url(#bg-grad)" />

  <!-- Animated Grid Patterns & Particles in Background -->
  <g opacity="0.15">
    <path d="M0 40 H900 M0 80 H900 M0 120 H900 M0 160 H900 M0 200 H900 M0 240 H900" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 5" />
    <path d="M100 0 V260 M200 0 V260 M300 0 V260 M400 0 V260 M500 0 V260 M600 0 V260 M700 0 V260 M800 0 V260" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 5" />
  </g>

  <!-- Background Dynamic Network Flow Animation (Behind Text) -->
  <g opacity="0.3">
    <!-- Pulse Line 1 -->
    <path d="M-50 180 Q 225 120, 450 180 T 950 180" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Pulse Line 2 -->
    <path d="M-50 80 Q 225 150, 450 80 T 950 80" fill="none" stroke="#a855f7" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Floating Security Nodes (Pulsing) -->
    <circle cx="150" cy="70" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="190" r="5" fill="#c084fc">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="60" r="4" fill="#6366f1">
      <animate attributeName="r" values="2;6;2" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Top Line Glow -->
  <rect x="0" y="0" width="900" height="4" fill="url(#glow)" />

  <!-- Shield Logo Icon (Left Side) -->
  <g transform="translate(55, 65)">
    <!-- Outer Shield Glow -->
    <path d="M60 10 L110 30 V75 C110 115 60 140 60 140 C60 140 10 115 10 75 V30 Z" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.6">
      <animate attributeName="stroke-width" values="2;5;2" dur="3s" repeatCount="indefinite" />
    </path>
    <!-- Inner Shield Body -->
    <path d="M60 18 L102 35 V72 C102 106 60 128 60 128 C60 128 18 106 18 72 V35 Z" fill="url(#firewall-shield)" opacity="0.85" />
    <!-- Lock / Firewall Flame Icon overlay inside Shield -->
    <path d="M60 45 C52 58 48 65 48 76 C48 83 53 88 60 88 C67 88 72 83 72 76 C72 65 68 58 60 45 Z" fill="#ffffff" />
    <path d="M60 60 C56 68 54 72 54 77 C54 80 57 83 60 83 C63 83 66 80 66 77 C66 72 64 68 60 60 Z" fill="#38bdf8" />
  </g>

  <!-- Foreground Title and Subtitle Text -->
  <g transform="translate(190, 0)">
    <!-- Main Title -->
    <text x="0" y="105" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Managed Cloud Network Firewall
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#94a3b8" font-size="16" font-weight="500">
      Curated Cloud-Native Firewalls, Self-Hosted NGFW &amp; eBPF Security Platforms
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 170)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="67" y="18" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">☁️ SaaS &amp; Cloud</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="217" y="18" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">🛡️ Open-Source NGFW</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
      <text x="367" y="18" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">⚡ eBPF / XDP Engines</text>

      <!-- Pill 4 -->
      <rect x="445" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="507" y="18" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">🔒 Market Metrics</text>
    </g>
  </g>
</svg>
